[project]
name = "ipo-tracker-backend"
version = "0.1.0"
description = "Indian IPO tracker - dashboard, subscription/GMP analytics and last-day alerts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pyjwt>=2.9",
    "pywebpush>=2.0",
    "python-dateutil>=2.9",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes these; reformatting them on every autogenerate is churn.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # FastAPI's dependency injection is expressed as `= Depends(...)` defaults;
    # this rule flags the framework's core idiom, not a bug.
    "B008",
    # `class X(str, Enum)` is kept over StrEnum for explicit SQLAlchemy Enum mapping.
    "UP042",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
